<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do Avançado</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="js/scripts.js" type="module"></script>
</head>

<body>
    <div class="todo-container">
        <header>
            <h1>To-do Avançado</h1>
        </header>
        <form id="todo-form">
            <p>Adicione a sua tarefa:</p>
            <div class="form-control">
                <input type="text" id="todo-input" placeholder="O que você vai fazer?">
                <button type="submit">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <div class="priority-control">
                <label for="todo-priority">Prioridade:</label>
                <select id="todo-priority">
                    <option value="low">Baixa</option>
                    <option value="medium" selected>Média</option>
                    <option value="high">Alta</option>
                </select>
            </div>
            <div class="category-control">
                <label for="todo-category">Categoria:</label>
                <select id="todo-category">
                    <option value="none" selected>Sem categoria</option>
                    <option value="studies">Estudos</option>
                    <option value="work">Trabalho</option>
                    <option value="personal">Pessoal</option>
                </select>
            </div>
            <div class="deadline-control">
                <label for="todo-deadline">Prazo:</label>
                <input type="date" id="todo-deadline">
            </div>
        </form>
        <form id="edit-form" class="hide">
            <p>Edite a sua tarefa:</p>
            <div class="form-control">
                <input type="text" id="edit-input">
                <button type="submit">
                    <i class="fa-solid fa-check-double"></i>
                </button>
            </div>
            <div class="priority-control">
                <label for="edit-priority">Prioridade:</label>
                <select id="edit-priority">
                    <option value="low">Baixa</option>
                    <option value="medium" selected>Média</option>
                    <option value="high">Alta</option>
                </select>
            </div>
            <div class="category-control">
                <label for="edit-category">Categoria:</label>
                <select id="edit-category">
                    <option value="none" selected>Sem categoria</option>
                    <option value="studies">Estudos</option>
                    <option value="work">Trabalho</option>
                    <option value="personal">Pessoal</option>
                </select>
            </div>
            <div class="deadline-control">
                <label for="edit-deadline">Prazo:</label>
                <input type="date" id="edit-deadline">
            </div>
            <button id="cancel-edit-btn">Cancelar</button>
        </form>
        <div id="toolbar">
            <div id="search">
                <h4>Pesquisar:</h4>
                <form>
                    <input type="text" id="search-input" placeholder="Buscar">
                    <button id="erase-button">
                        <i class="fa-solid fa-delete-left"></i>
                    </button>
                </form>
            </div>
            <div id="filter">
                <h4>Filtrar:</h4>
                <select id="filter-select">
                    <option value="all">Todos</option>
                    <option value="done">Feitos</option>
                    <option value="todo">A fazer</option>
                    <option value="overdue">Atrasadas</option>
                </select>
            </div>
            <div id="category-filter">
                <label for="category-filter-select">Categoria:</label>
                <select id="category-filter-select">
                    <option value="all" selected>Todas as categorias</option>
                    <option value="none">Sem categoria</option>
                    <option value="studies">Estudos</option>
                    <option value="work">Trabalho</option>
                    <option value="personal">Pessoal</option>
                </select>
            </div>
            <div id="priority-filter">
                <label for="priority-filter-select">Prioridade:</label>
                <select id="priority-filter-select">
                    <option value="all" selected>Todas as prioridades</option>
                    <option value="low">Baixa</option>
                    <option value="medium">Média</option>
                    <option value="high">Alta</option>
                </select>
            </div>
            <div id="task-sorting">
                <label for="sort-select">Ordenar por:</label>
                <select id="sort-select">
                    <option value="default">Ordem de cadastro</option>
                    <option value="deadline">Prazo mais próximo</option>
                    <option value="priority">Maior prioridade</option>
                </select>
            </div>
            <div id="toolbar-actions">
                <button type="button" id="clear-filters-btn">Limpar filtros</button>
            </div>    
        </div>       
        <div id="task-counter">
            <p>Total: <span id="total-count">0</span></p>
            <p>Pendentes: <span id="pending-count">0</span></p>
            <p>Concluídas: <span id="completed-count">0</span></p>
        </div>
        <div id="todo-list">
        </div>
        <p id="empty-message" class="hide">Nenhuma tarefa encontrada</p>
    </div>
</body>

</html>
